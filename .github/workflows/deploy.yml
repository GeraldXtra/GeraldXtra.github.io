# Builds the site and publishes it to GitHub Pages.
#
# This matters because the index.html sitting in the repository root is the Vite
# entry point, not a finished page. It asks the browser for /src/main.jsx, which
# only exists as raw JSX. Serving the repository root directly would hand every
# visitor a blank screen, so Pages has to serve the built output from dist
# instead.
#
# One setting is needed in the repository before this runs:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Lets the workflow be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the one in flight rather than cancelling it, so a
# half finished deploy never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
