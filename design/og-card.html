<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: "Jost", sans-serif;
        background: #141210;
        color: #f2ede3;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 76px;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(46% 52% at 82% 22%, rgba(181, 84, 30, 0.28), transparent 66%),
          radial-gradient(40% 46% at 8% 86%, rgba(59, 94, 69, 0.22), transparent 64%);
      }
      .lines { position: absolute; inset: 0; }
      .lines span {
        position: absolute; top: 0; width: 1px; height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1) 24%, rgba(255,255,255,0.1) 76%, transparent);
      }
      .lines span:nth-child(1) { left: 20%; }
      .lines span:nth-child(2) { right: 28%; background: linear-gradient(to bottom, transparent, rgba(181,84,30,0.32) 34%, transparent 84%); }
      .lines span:nth-child(3) { right: 9%; }
      .row { position: relative; display: flex; align-items: center; justify-content: space-between; }
      .mark {
        font-family: "Playfair Display", serif;
        font-size: 34px; font-weight: 700; letter-spacing: -0.03em; color: #f5f0e6;
      }
      .mark i { font-style: normal; color: #b5541e; }
      .status {
        display: inline-flex; align-items: center; gap: 11px;
        border: 1px solid rgba(181,84,30,0.4);
        background: rgba(181,84,30,0.1);
        border-radius: 999px; padding: 9px 20px;
        font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: #e28f5c;
      }
      .status b { width: 9px; height: 9px; border-radius: 50%; background: #d4723a; }
      main { position: relative; }
      h1 {
        font-family: "Playfair Display", serif;
        font-size: 92px; font-weight: 700; line-height: 1.0;
        letter-spacing: -0.035em; color: #f5f0e6;
      }
      h1 em { font-style: italic; font-weight: 500; color: #d4723a; }
      h1 .amp { color: #7d6e5e; font-weight: 400; }
      p {
        margin-top: 26px; font-size: 25px; line-height: 1.6;
        color: #ab9f92; max-width: 30ch; font-weight: 300;
      }
      .rule { width: 62px; height: 3px; background: #b5541e; margin-top: 30px; }
      .foot { position: relative; display: flex; align-items: center; justify-content: space-between; }
      .who { font-size: 19px; letter-spacing: 0.06em; color: #ab9f92; }
      .who b { color: #f2ede3; font-weight: 500; }
      .tags { display: flex; gap: 10px; }
      .tags span {
        font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #9a8a78; border: 1px solid rgba(255,255,255,0.12);
        padding: 8px 15px; border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="lines"><span></span><span></span><span></span></div>

    <div class="row">
      <div class="mark">EUG<i>.</i></div>
      <div class="status"><b></b>Available for remote work</div>
    </div>

    <main>
      <h1>Software Developer<br /><span class="amp">&amp;</span> <em>UI/UX Designer</em></h1>
      <div class="rule"></div>
      <p>Websites and products built end to end, design and code by one pair of hands.</p>
    </main>

    <div class="foot">
      <div class="who"><b>Eberechukwu Uchechukwu Gerald</b> &nbsp;·&nbsp; Lagos, Nigeria</div>
      <div class="tags"><span>React</span><span>Figma</span><span>Design Systems</span></div>
    </div>
  </body>
</html>
