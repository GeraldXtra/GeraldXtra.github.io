<!doctype html>
<!-- Link preview image. Render at 1200x630 and save as public/og-card.png. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Schibsted+Grotesk:wght@400;500&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 64px;
        align-items: center;
        padding: 72px 80px;
        background: #f8f7f4;
        color: #16171a;
        font-family: "Schibsted Grotesk", Arial, sans-serif;
        border-bottom: 10px solid #a8431a;
      }
      .name { font-size: 28px; color: #4a4d53; font-weight: 500; }
      h1 {
        margin-top: 12px;
        font-family: "Newsreader", Georgia, serif;
        font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -0.02em;
      }
      .line { margin-top: 30px; font-size: 28px; line-height: 1.4; color: #4a4d53; max-width: 24em; }
      .url { margin-top: 36px; font-size: 24px; color: #a8431a; font-weight: 500; }
      figure { padding: 10px; background: #fff; border: 1px solid #e2e0da; border-radius: 4px; }
      img { display: block; width: 100%; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div>
      <p class="name">Eberechukwu Uchechukwu Gerald</p>
      <h1>Web &amp; App Developer</h1>
      <p class="line">React and Node.js web apps, and Windows desktop apps with Electron. Lagos, Nigeria.</p>
      <p class="url">geraldxtra.github.io</p>
    </div>
    <figure><img src="../src/assets/portrait.webp" alt="" /></figure>
  </body>
</html>
