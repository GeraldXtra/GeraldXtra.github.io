.ld-open .ld-bg{--l-r:var(--l-R,3000px);mask-image:radial-gradient(circle at var(--l-x) var(--l-y),#0000 var(--l-r),#000 calc(var(--l-r) + 36px))}

.ld-dot,.ld-ring{transform-box:fill-box;transform-origin:center}
.ld-tip{opacity:0}
.ld-draw .ld-dot{opacity:0;animation:ldDrop .6s cubic-bezier(.3,.6,.4,1) 1.2s forwards}

@keyframes ldDrop{0%{opacity:0;transform:translateY(-46px)}40%{opacity:1}58%{transform:none}76%{transform:translateY(-7px)}to{opacity:1;transform:none}}

<script>
/* Drives the loading screen. Progress is real: parsed, fonts, app mounted, map drawn (React reports the last two
   through window.__loader). It leaves after 6 s whatever happens, and only runs when html has the js class. */
(function(){var d=document,h=d.documentElement,ld=d.getElementById("ld");
function finish(){if(!ld)return;ld.remove();ld=null;h.classList.remove("ld-lock","ld-hold","ld-fly");var r=d.getElementById("root");if(r)r.removeAttribute("aria-busy");try{sessionStorage.setItem("eug-ld","1")}catch(e){}}
try{if(!ld||!h.classList.contains("js"))return;
var rm=matchMedia("(prefers-reduced-motion: reduce)").matches,first=true;try{first=!sessionStorage.getItem("eug-ld")}catch(e){}
var draw=first&&!rm,min=draw?2100:500,t0=performance.now(),st={},done=false,safety=setTimeout(reveal,6000);
h.classList.add("ld-lock");if(!rm)h.classList.add("ld-hold");if(draw)ld.classList.add("ld-draw");
var lg=ld.querySelector(".ld-logo"),dot=ld.querySelector(".ld-dot"),bg=ld.querySelector(".ld-bg"),cap=d.getElementById("ld-step"),tm=d.getElementById("ld-time"),fmt=null;
try{fmt=new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Africa/Lagos"})}catch(e){}
function tick(){if(fmt)tm.textContent=fmt.format(new Date())}tick();var clock=setInterval(tick,10000);
function paint(){ld.style.setProperty("--l-p",(1+(st.fonts|0)+(st.mounted|0)+(st.map|0))/4);cap.textContent=!st.fonts?"Loading fonts":!st.data?"Loading the map":!st.map?"Drawing the streets":"Ready";check()}
function check(){if(done||!(st.fonts&&st.mounted&&st.map))return;var left=min-(performance.now()-t0);left<=0?reveal():setTimeout(check,left)}
if(d.fonts&&d.fonts.ready)d.fonts.ready.then(function(){st.fonts=1;paint()});else st.fonts=1;
window.__loader={step:function(n){st[n]=1;if(n==="map")st.data=1;paint()},onReveal:null,quiet:0};
var frame=null;
if(draw){var ps=ld.querySelectorAll(".ld-ink path"),tips=ld.querySelectorAll(".ld-tip"),L=[],S=[0,.3,.38,.72],D=[.42,.22,.48,.48],i;
for(i=0;i<4;i++){L[i]=ps[i].getTotalLength();ps[i].style.strokeDasharray=L[i]+24;ps[i].style.strokeDashoffset=L[i]+36}
frame=function(now){var t=(now-t0)/1000,on=false;for(var i=0;i<4;i++){var p=Math.min(1,Math.max(0,(t-S[i])/D[i])),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,pt=ps[i].getPointAtLength(L[i]*e);ps[i].style.strokeDashoffset=L[i]+36-e*(L[i]+24);tips[i].setAttribute("cx",pt.x);tips[i].setAttribute("cy",pt.y);tips[i].style.opacity=p>0&&p<1?1:0;if(p<1)on=true}if(on&&ld)requestAnimationFrame(frame)}}
/* the clock starts on the first painted frame; the map keeps its heavy first draw until the wordmark is drawn */
requestAnimationFrame(function(now){t0=now;window.__loader.quiet=draw?now+1850:0;if(frame)frame(now)});
function reveal(){if(done||!ld)return;done=true;clearTimeout(safety);clearInterval(clock);ld.style.setProperty("--l-p",1);ld.classList.add("ld-out");h.classList.remove("ld-hold");
var r=dot.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
if(window.__loader.onReveal)try{window.__loader.onReveal(x,y)}catch(e){}
if(rm){ld.classList.add("ld-fade");setTimeout(finish,220);return}
var R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+40,mk=d.querySelector(".nav .logo__mark"),a=lg.getBoundingClientRect(),b=mk&&mk.getBoundingClientRect();
bg.style.cssText="--l-x:"+x+"px;--l-y:"+y+"px;--l-R:"+R+"px";
var fb=setTimeout(finish,1400);lg.addEventListener("transitionend",function(e){if(e.propertyName==="transform"){clearTimeout(fb);finish()}});
requestAnimationFrame(function(){ld.classList.add("ld-open");if(b&&b.width){h.classList.add("ld-fly");lg.style.transform="translate("+(b.left-a.left)+"px,"+(b.top-a.top)+"px) scale("+b.width/a.width+")"}else lg.style.opacity=0})}
paint()}catch(e){finish()}})();
</script>
